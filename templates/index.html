<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Household Expenses</title>

    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

<div class="container">

    <header>
        <h1>Household Expenses</h1>
        <p>Record your daily expenses</p>
    </header>

    <!-- Expense Form -->
    <section class="card">

        <h2>Add Expense</h2>

        <form id="expenseForm">

            <div class="form-grid">

                <!-- Date -->
                <div class="form-group">
                    <label for="transaction_date">Date</label>
                    <input
                        type="date"
                        id="transaction_date"
                        name="transaction_date"
                        required
                    >
                </div>

                <!-- Merchant -->
                <div class="form-group">
                    <label for="merchant">Merchant</label>
                    <input
                        type="text"
                        id="merchant"
                        name="merchant"
                        placeholder="e.g. Jollibee"
                        maxlength="150"
                        required
                    >
                </div>

                <!-- Amount -->
                <div class="form-group">
                    <label for="amount">Amount</label>
                    <div class="amount-input">
                        <span aria-hidden="true">₱</span>
                        <input
                            type="number"
                            id="amount"
                            name="amount"
                            placeholder="0.00"
                            min="0.01"
                            step="0.01"
                            required
                        >
                    </div>
                </div>

                <!-- Payment Source -->
                <div class="form-group">
                    <span class="form-label">Payment Source</span>

                    <div
                        class="payment-options"
                        id="paymentOptions"
                        role="group"
                        aria-label="Payment source options"
                    >
                        <p class="loading">Loading payment sources...</p>
                    </div>

                    <input
                        type="hidden"
                        id="payment_source_id"
                        name="payment_source_id"
                        required
                    >
                </div>

                <!-- Installments -->
                <div
                    class="form-group"
                    id="installmentGroup"
                    hidden
                >
                    <label for="installment_count">
                        Installments
                        <span class="optional">(optional)</span>
                    </label>

                    <input
                        type="number"
                        id="installment_count"
                        name="installment_count"
                        min="2"
                        step="1"
                        placeholder="e.g. 6"
                        inputmode="numeric"
                    >
                </div>

                <!-- Category -->
                <div class="form-group">
                    <label for="category">Category</label>

                    <input
                        type="text"
                        id="category"
                        name="category"
                        placeholder="e.g. Food"
                    >
                </div>

                <!-- Description -->
                <div class="form-group">
                    <label for="description">
                        Description
                        <span class="optional">(optional)</span>
                    </label>

                    <input
                        type="text"
                        id="description"
                        name="description"
                        placeholder="e.g. Lunch"
                    >
                </div>

            </div>

            <!-- Notes -->
            <div class="form-group">
                <label for="notes">
                    Notes
                    <span class="optional">(optional)</span>
                </label>

                <textarea
                    id="notes"
                    name="notes"
                    placeholder="Additional notes..."
                    rows="3"
                ></textarea>
            </div>

            <button
                type="submit"
                id="saveButton"
                class="save-button"
            >
                Save Expense
            </button>

        </form>

        <!-- Message -->
        <div
            id="message"
            class="message"
            role="status"
            aria-live="polite"
        ></div>

    </section>

    <!-- Recent Expenses -->
    <section class="card">

        <div class="section-header">
            <div>
                <h2>Recent Expenses</h2>
                <p>Your latest recorded receipts</p>
            </div>

            <button
                type="button"
                id="refreshButton"
                class="refresh-button"
            >
                Refresh
            </button>
        </div>

        <div id="expensesContainer">

            <p class="loading">
                Loading expenses...
            </p>

        </div>

    </section>

</div>

<script src="/static/app.js"></script>

</body>
</html>
