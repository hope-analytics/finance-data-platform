<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Household Expenses</title>

    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

<div class="container">

    <header>
        <h1>Household Expenses</h1>
        <p>Record your daily expenses</p>
    </header>

    <!-- Expense Form -->
    <section class="card">

        <h2>Add Expense</h2>

        <form id="expenseForm">

            <div class="form-grid">

                <!-- 1. Transaction date -->
                <div class="form-group">
                    <label for="transaction_date">Transaction date</label>
                    <input
                        type="date"
                        id="transaction_date"
                        name="transaction_date"
                        required
                    >
                </div>

                <!-- 2. Merchant -->
                <div class="form-group">
                    <label for="merchant">Merchant</label>
                    <input
                        type="text"
                        id="merchant"
                        name="merchant"
                        placeholder="e.g. Jollibee"
                        maxlength="150"
                        required
                    >
                </div>

                <!-- 3. Amount -->
                <div class="form-group">
                    <label for="amount">Amount</label>
                    <div class="amount-input">
                        <span aria-hidden="true">₱</span>
                        <input
                            type="number"
                            id="amount"
                            name="amount"
                            placeholder="0.00"
                            min="0.01"
                            step="0.01"
                            required
                        >
                    </div>
                </div>

                <!-- 4. Category -->
                <div class="form-group">
                    <label for="category">Category</label>
                    <input
                        type="text"
                        id="category"
                        name="category"
                        list="categoryOptions"
                        placeholder="Select or enter a category"
                        autocomplete="off"
                    >
                    <datalist id="categoryOptions"></datalist>
                </div>

                <!-- 5. Payment source and optional installments -->
                <div class="form-group payment-source-box">
                    <label for="payment_source_id">Payment Source</label>

                    <div id="paymentOptions">
                        <select
                            id="payment_source_id"
                            name="payment_source_id"
                            required
                            disabled
                        >
                            <option value="">Loading payment sources...</option>
                        </select>
                    </div>

                    <div id="installmentGroup" class="installment-group" hidden>
                        <label for="installment_count">
                            Installment plan
                            <span class="optional">(optional)</span>
                        </label>

                        <input
                            type="number"
                            id="installment_count"
                            name="installment_count"
                            min="2"
                            step="1"
                            placeholder="Number of months, e.g. 6"
                            inputmode="numeric"
                        >

                        <p class="field-hint">
                            Only applies to credit-card purchases.
                        </p>
                    </div>
                </div>

                <!-- 6. Owner -->
                <div class="form-group">
                    <label for="owner_id">Owner</label>
                    <select id="owner_id" name="owner_id" required>
                        <option value="">Loading people...</option>
                    </select>
                </div>

                <!-- 7. Participants -->
                <div class="form-group">
                    <label for="participantsDropdownButton">Participants</label>

                    <div class="participants-dropdown" id="participantsDropdown">
                        <button
                            type="button"
                            id="participantsDropdownButton"
                            class="participants-dropdown-button"
                            aria-expanded="false"
                            aria-controls="participantsDropdownPanel"
                        >
                            <span id="participantsDropdownLabel">
                                Select participants
                            </span>
                            <span aria-hidden="true">▾</span>
                        </button>

                        <div
                            id="participantsDropdownPanel"
                            class="participants-dropdown-panel"
                            hidden
                        >
                            <div id="participantChecklist"></div>
                        </div>
                    </div>
                </div>

                <!-- 8. Description -->
                <div class="form-group">
                    <label for="description">
                        Description
                        <span class="optional">(optional)</span>
                    </label>
                    <input
                        type="text"
                        id="description"
                        name="description"
                        placeholder="e.g. Lunch"
                    >
                </div>

            </div>

            <!-- 9. Notes -->
            <div class="form-group notes-group">
                <label for="notes">
                    Notes
                    <span class="optional">(optional)</span>
                </label>
                <textarea
                    id="notes"
                    name="notes"
                    placeholder="Additional notes..."
                    rows="3"
                ></textarea>
            </div>
            
            <button
            type="submit"
            id="saveButton"
            class="save-button"
            >
            Save Expense
            </button>

        </form>

        <!-- Message -->
        <div
            id="message"
            class="message"
            role="status"
            aria-live="polite"
        ></div>

    </section>

    <!-- Recent Expenses -->
    <section class="card">

        <div class="section-header">
            <div>
                <h2>Recent Expenses</h2>
                <p>Your latest recorded receipts</p>
            </div>

            <button
                type="button"
                id="refreshButton"
                class="refresh-button"
            >
                Refresh
            </button>
        </div>

        <div id="expensesContainer">

            <p class="loading">
                Loading expenses...
            </p>

        </div>

    </section>

</div>

<script src="/static/app.js"></script>

</body>
</html>
